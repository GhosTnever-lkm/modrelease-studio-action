name: ModRelease Gate
description: Scan a game-mod repository with ModRelease Studio, publish safe annotations, and upload Markdown, JSON, and SARIF reports.
author: GhosTnever
inputs:
  mod-path:
    description: Path to the mod folder or ZIP; it must resolve inside the checked-out workspace.
    required: false
    default: .
  config-file:
    description: Optional existing modrelease.toml inside the checked-out workspace; symlink escapes are rejected.
    required: false
    default: ''
  tool-version:
    description: ModRelease Studio release tag. Accepts an exact semantic version with or without the leading v.
    required: false
    default: v0.3.81
  python-version:
    description: Python version used to run ModRelease Studio.
    required: false
    default: '3.12'
  artifact-name:
    description: Name of the uploaded report artifact.
    required: false
    default: modrelease-report
  fail-on-warning:
    description: Fail the job when the report contains one or more warnings.
    required: false
    default: 'false'
outputs:
  json-report:
    description: Path to the generated JSON report on the runner.
    value: ${{ steps.paths.outputs.json-report }}
  markdown-report:
    description: Path to the generated Markdown report on the runner.
    value: ${{ steps.paths.outputs.markdown-report }}
  sarif-report:
    description: Path to the generated SARIF 2.1.0 report on the runner.
    value: ${{ steps.paths.outputs.sarif-report }}
  sarif-ready:
    description: Whether the SARIF report was generated successfully.
    value: ${{ steps.sarif.outputs.sarif-ready }}
runs:
  using: composite
  steps:
    - name: Validate fail-on-warning input
      shell: bash
      env:
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
      run: |
        case "$FAIL_ON_WARNING" in
          true|false) ;;
          *) echo "fail-on-warning must be true or false" >&2; exit 2 ;;
        esac
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Validate and normalize tool version
      id: validate-version
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.tool-version }}
      run: python "${GITHUB_ACTION_PATH}/scripts/normalize_tool_version.py"
    - name: Validate input paths stay inside the workspace
      id: validate-paths
      shell: bash
      env:
        MOD_PATH: ${{ inputs.mod-path }}
        CONFIG_FILE: ${{ inputs.config-file }}
        WORKSPACE: ${{ github.workspace }}
      run: python "${GITHUB_ACTION_PATH}/scripts/validate_workspace_path.py"
    - name: Install ModRelease Studio
      shell: bash
      env:
        TOOL_VERSION: ${{ steps.validate-version.outputs.normalized }}
      run: python -m pip install "modrelease-studio @ git+https://github.com/GhosTnever-lkm/modrelease-studio.git@${TOOL_VERSION}"
    - name: Prepare report paths
      id: paths
      shell: bash
      run: |
        echo "json-report=$RUNNER_TEMP/modrelease-report.json" >> "$GITHUB_OUTPUT"
        echo "markdown-report=$RUNNER_TEMP/modrelease-report.md" >> "$GITHUB_OUTPUT"
        echo "sarif-report=$RUNNER_TEMP/modrelease-report.sarif" >> "$GITHUB_OUTPUT"
    - name: Scan mod
      shell: bash
      env:
        MOD_PATH: ${{ inputs.mod-path }}
        CONFIG_FILE: ${{ inputs.config-file }}
        JSON_REPORT: ${{ runner.temp }}/modrelease-report.json
        MARKDOWN_REPORT: ${{ runner.temp }}/modrelease-report.md
        SARIF_REPORT: ${{ runner.temp }}/modrelease-report.sarif
        SARIF_PATH_PREFIX: ${{ steps.validate-paths.outputs.sarif-path-prefix }}
      run: |
        args=(scan "$MOD_PATH" --json-out "$JSON_REPORT" --md-out "$MARKDOWN_REPORT" --sarif-out "$SARIF_REPORT")
        if [[ -n "$SARIF_PATH_PREFIX" ]]; then
          args+=(--sarif-path-prefix "$SARIF_PATH_PREFIX")
        fi
        if [[ -n "$CONFIG_FILE" ]]; then
          args+=(--config "$CONFIG_FILE")
        fi
        set +e
        modrelease "${args[@]}" > "$RUNNER_TEMP/modrelease-scan.log" 2>&1
        scan_status=$?
        set -e
        if [[ "$scan_status" -ne 0 ]]; then
          echo "::error title=ModRelease Studio::Scan exited with status ${scan_status}. Review the report artifact if it was created."
          exit "$scan_status"
        fi
    - name: Set SARIF readiness output
      id: sarif
      if: always()
      shell: bash
      env:
        SARIF_REPORT: ${{ runner.temp }}/modrelease-report.sarif
      run: |
        if [[ -s "$SARIF_REPORT" ]]; then
          echo "sarif-ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "sarif-ready=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Add findings to the workflow
      if: always()
      shell: bash
      env:
        JSON_REPORT: ${{ runner.temp }}/modrelease-report.json
        FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
      run: python "${GITHUB_ACTION_PATH}/scripts/annotate.py" "$JSON_REPORT"
    - name: Upload scan reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/modrelease-report.md
          ${{ runner.temp }}/modrelease-report.json
          ${{ runner.temp }}/modrelease-report.sarif
        if-no-files-found: ignore
