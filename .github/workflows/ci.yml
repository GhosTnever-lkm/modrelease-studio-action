name: Action tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-checkout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject case-insensitive tracked-path collisions
        run: python scripts/check_casefold_paths.py
      - name: Run portable unit tests
        run: python -m unittest discover -s tests -v
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run annotation regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the sample report formatter
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/modrelease-summary.md
        run: python scripts/annotate.py examples/findings.sample.json
      - name: Reject a scanner tag that violates SemVer
        id: invalid-semver
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-project
          tool-version: v01.0.0
      - name: Assert invalid scanner tag was rejected
        env:
          ACTION_OUTCOME: ${{ steps.invalid-semver.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Exercise the composite Action with a project policy
        uses: ./
        with:
          mod-path: examples/policy-project
          config-file: examples/policy-project/modrelease.toml
      - name: Assert default scanner version
        run: test "$(modrelease --version)" = "modrelease 0.3.78"
      - name: Exercise the scanner version input without a leading v
        id: unprefixed-version
        uses: ./
        with:
          mod-path: examples/policy-project
          tool-version: 0.3.71
          artifact-name: unprefixed-version-report
      - name: Assert the unprefixed scanner version succeeds
        env:
          ACTION_OUTCOME: ${{ steps.unprefixed-version.outcome }}
        run: test "$ACTION_OUTCOME" = "success"
      - name: Assert unprefixed scanner version installed the requested release
        run: test "$(modrelease --version)" = "modrelease 0.3.71"
      - name: Create a synthetic SARIF path fixture
        run: |
          mkdir -p sarif-project/common
          printf 'api_key=FAKE_api_key_value_123456789\n' > sarif-project/common/settings.cfg
      - name: Generate SARIF with a checkout-relative subdirectory prefix
        id: sarif-path-scan
        uses: ./
        continue-on-error: true
        with:
          mod-path: sarif-project
          tool-version: v0.3.71
          artifact-name: sarif-path-report
      - name: Assert SARIF output survives a blocking finding with repository paths
        env:
          ACTION_OUTCOME: ${{ steps.sarif-path-scan.outcome }}
          SARIF_REPORT: ${{ steps.sarif-path-scan.outputs.sarif-report }}
          SARIF_READY: ${{ steps.sarif-path-scan.outputs.sarif-ready }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          assert os.environ["ACTION_OUTCOME"] == "failure"
          assert os.environ["SARIF_READY"] == "true"
          report = json.loads(Path(os.environ["SARIF_REPORT"]).read_text(encoding="utf-8"))
          assert report["version"] == "2.1.0"
          result = next(item for item in report["runs"][0]["results"] if item["ruleId"] == "GENERIC_API_KEY")
          uri = result["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
          assert uri == "sarif-project/common/settings.cfg"
          PYCODE
      - name: Verify changed-file-size warning from the installed scanner
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.models import FileRecord, Source
          from modrelease_studio.scanner import scan_source
          with TemporaryDirectory() as directory:
              source = Source(Path(directory), [FileRecord("growing.txt", 1)], [], False)
              with patch.object(Source, "read", return_value=b"x" * 11), patch.object(Source, "digest", return_value="0" * 64):
                  report = scan_source(source, config={"max_file_bytes": 10, "required_files": []})
          finding = next(item for item in report.findings if item.code == "LARGE_TEXT_FILE")
          assert finding.severity == "WARNING" and "exceeded" in finding.message
          assert report.status == "REVIEW"
          PYCODE
      - name: Verify traversal policy with installed scanner
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              root = Path(directory)
              for relative in (".venv/credentials.cfg", "node_modules/pkg/settings.cfg"):
                  path = root / relative
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("api_key=FAKE_api_key_value_123456789", encoding="utf-8")
              (root / "Thumbs.db").write_bytes(b"")
              (root / "mod.cfg").write_text("name=sample", encoding="utf-8")
              with patch("modrelease_studio.sources.MAX_ENTRIES", 2):
                  report = scan_path(root, config={"required_files": []})
          codes = {item.code for item in report.findings}
          assert "GENERIC_API_KEY" not in codes
          assert "OS_JUNK" in codes
          assert "ENTRY_LIMIT" not in codes
          assert report.file_count == 2 and report.errors == 0
          PYCODE
      - name: Verify ZIP scans include generated-directory secrets
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              archive = Path(directory) / "release.zip"
              with ZipFile(archive, "w") as bundle:
                  bundle.writestr(".git/config.cfg", "api_key=FAKE_api_key_value_123456789")
              report = scan_path(archive, config={"required_files": []})
          assert any(item.code == "GENERIC_API_KEY" and item.path == ".git/config.cfg" for item in report.findings)
          assert report.errors == 1
          PYCODE
      - name: Verify warning policy with emitted scanner finding
        env:
          REPORT_PATH: ${{ runner.temp }}/growth-warning.json
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.models import FileRecord, Source
          from modrelease_studio.reports import json_report
          from modrelease_studio.scanner import scan_source
          with TemporaryDirectory() as directory:
              source = Source(Path(directory), [FileRecord("growing.txt", 1)], [], False)
              with patch.object(Source, "read", return_value=b"x" * 11), patch.object(Source, "digest", return_value="0" * 64):
                  report = scan_source(source, config={"max_file_bytes": 10, "required_files": []})
          Path(os.environ["REPORT_PATH"]).write_text(json_report(report), encoding="utf-8")
          PYCODE
          set +e
          python scripts/annotate.py "$REPORT_PATH"
          advisory=$?
          FAIL_ON_WARNING=true python scripts/annotate.py "$REPORT_PATH"
          strict=$?
          set -e
          test "$advisory" -eq 0
          test "$strict" -eq 1
      - name: Verify junction finding follows warning policy
        env:
          REPORT_PATH: ${{ runner.temp }}/junction-warning.json
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.reports import json_report
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              root = Path(directory) / "mod"
              junction = root / "junction"
              junction.mkdir(parents=True)
              (junction / "fixture.txt").write_text("synthetic fixture", encoding="utf-8")
              with patch.object(Path, "is_junction", lambda path: path.name == "junction", create=True):
                  report = scan_path(root, config={"required_files": []})
          finding = next(item for item in report.findings if item.code == "JUNCTION")
          assert finding.severity == "WARNING" and report.status == "REVIEW"
          Path(os.environ["REPORT_PATH"]).write_text(json_report(report), encoding="utf-8")
          PYCODE
          set +e
          python scripts/annotate.py "$REPORT_PATH"
          advisory=$?
          FAIL_ON_WARNING=true python scripts/annotate.py "$REPORT_PATH"
          strict=$?
          set -e
          test "$advisory" -eq 0
          test "$strict" -eq 1
      - name: Verify unreadable junction metadata is pruned and advisory
        env:
          REPORT_PATH: ${{ runner.temp }}/metadata-warning.json
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.reports import json_report
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              root = Path(directory) / "mod"
              restricted = root / "restricted"
              restricted.mkdir(parents=True)
              (root / "inside.txt").write_text("inside fixture", encoding="utf-8")
              (restricted / "private-fixture.txt").write_text("do not index", encoding="utf-8")
              def junction_status(path):
                  if path.name == "restricted":
                      raise PermissionError(13, "Permission denied", str(path))
                  return False
              with patch.object(Path, "is_junction", junction_status, create=True):
                  report = scan_path(root, config={"required_files": []})
          finding = next(item for item in report.findings if item.code == "READ_METADATA")
          assert finding.path == "restricted" and finding.severity == "WARNING"
          assert report.file_count == 1 and report.errors == 0
          Path(os.environ["REPORT_PATH"]).write_text(json_report(report), encoding="utf-8")
          PYCODE
          set +e
          python scripts/annotate.py "$REPORT_PATH"
          advisory=$?
          FAIL_ON_WARNING=true python scripts/annotate.py "$REPORT_PATH"
          strict=$?
          set -e
          test "$advisory" -eq 0
          test "$strict" -eq 1
      - name: Create Unicode report fixture
        run: |
          mkdir -p unicode-output-project
          cat > unicode-output-project/modrelease.toml <<'TOML'
          [scan]
          required_paths = ["missing\u202eext\u2028line\u2029end.txt"]
          required_paths_severity = "WARNING"
          TOML
      - name: Scan with the current safe-output scanner
        id: unicode-output
        uses: ./
        with:
          mod-path: unicode-output-project
          config-file: unicode-output-project/modrelease.toml
          artifact-name: unicode-output-report
      - name: Assert downloaded report artifacts are safe and lossless
        env:
          JSON_REPORT: ${{ steps.unicode-output.outputs.json-report }}
          MARKDOWN_REPORT: ${{ steps.unicode-output.outputs.markdown-report }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = "missing" + chr(0x202E) + "ext" + chr(0x2028) + "line" + chr(0x2029) + "end.txt"
          json_text = Path(os.environ["JSON_REPORT"]).read_text(encoding="utf-8")
          markdown = Path(os.environ["MARKDOWN_REPORT"]).read_text(encoding="utf-8")
          parsed = json.loads(json_text)
          assert parsed["findings"][0]["path"] == raw
          for char in (chr(0x202E), chr(0x2028), chr(0x2029)):
              assert char not in json_text and char not in markdown
          assert all(code in markdown.lower() for code in ("202e", "2028", "2029"))
          PY

      - name: Create synthetic case-colliding ZIP fixture
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("path-collision.zip", "w") as archive:
              archive.writestr("Common/Events.txt", "first\n")
              archive.writestr("common/events.TXT", "second\n")
          PY
      - name: Verify cross-platform path collision blocks the action
        id: expected-collision-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: path-collision.zip
          tool-version: v0.3.78
          artifact-name: path-collision-report
      - name: Assert explicit scanner version
        run: test "$(modrelease --version)" = "modrelease 0.3.78"
      - name: Assert collision finding was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-collision-failure.outcome }}
          JSON_REPORT: ${{ steps.expected-collision-failure.outputs.json-report }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["JSON_REPORT"]).read_text(encoding="utf-8"))
          assert os.environ["ACTION_OUTCOME"] == "failure"
          assert any(item["code"] == "CASE_COLLISION" for item in report["findings"])
          PY
      - name: Create a synthetic Windows reserved-name archive
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("unsafe-path.zip", "w") as archive:
              archive.writestr("mod/CON.txt", "synthetic fixture only")
          PY
      - name: Verify a nonportable path blocks the Action
        id: expected-nonportable-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: unsafe-path.zip
          tool-version: v0.3.71
          artifact-name: unsafe-path-report
      - name: Assert nonportable path finding was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-nonportable-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Verify an out-of-range scan policy blocks the Action
        id: expected-invalid-policy
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-project
          config-file: examples/invalid-scan-config/modrelease.toml
          tool-version: v0.3.71
          artifact-name: invalid-policy-report
      - name: Assert invalid scan policy was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-invalid-policy.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Create a warning-only release fixture
        run: mkdir -p warning-project
      - name: Verify fail-on-warning blocks the Action
        id: expected-warning-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: warning-project
          tool-version: v0.3.71
          fail-on-warning: true
          artifact-name: warning-report
      - name: Assert warning policy was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-warning-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Create an outside-workspace config fixture
        run: printf '[scan]\nrequired_files = []\n' > "$RUNNER_TEMP/outside-modrelease.toml"
      - name: Verify an external config path blocks the Action
        id: expected-outside-config-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-project
          config-file: ${{ runner.temp }}/outside-modrelease.toml
          tool-version: v0.3.71
          artifact-name: outside-config-report
      - name: Assert external config path was rejected
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-outside-config-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Create a workspace symlink to the external config fixture
        run: ln -s "$RUNNER_TEMP/outside-modrelease.toml" config-symlink.toml
      - name: Verify a config symlink escape blocks the Action
        id: expected-config-symlink-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-project
          config-file: config-symlink.toml
          tool-version: v0.3.71
          artifact-name: symlink-config-report
      - name: Assert config symlink escape was rejected
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-config-symlink-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Create an outside-workspace mod directory
        run: mkdir -p "$RUNNER_TEMP/outside-mod"
      - name: Verify an external mod-path blocks the Action
        id: expected-outside-mod-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: ${{ runner.temp }}/outside-mod
          tool-version: v0.3.71
          artifact-name: outside-mod-report
      - name: Assert external mod-path was rejected
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-outside-mod-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
