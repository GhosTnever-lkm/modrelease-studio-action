name: Action tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run annotation regression tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the sample report formatter
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/modrelease-summary.md
        run: python scripts/annotate.py examples/findings.sample.json
      - name: Exercise the composite Action with a project policy
        uses: ./
        with:
          mod-path: examples/policy-project
          config-file: examples/policy-project/modrelease.toml
          tool-version: v0.3.15

      - name: Verify cross-platform path collision blocks the action
        id: expected-collision-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/path-collision-project
          tool-version: v0.3.15
          artifact-name: path-collision-report
      - name: Assert collision finding was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-collision-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Create a synthetic Windows reserved-name archive
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("unsafe-path.zip", "w") as archive:
              archive.writestr("mod/CON.txt", "synthetic fixture only")
          PY
      - name: Verify a nonportable path blocks the Action
        id: expected-nonportable-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: unsafe-path.zip
          tool-version: v0.3.15
          artifact-name: unsafe-path-report
      - name: Assert nonportable path finding was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-nonportable-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Verify an out-of-range scan policy blocks the Action
        id: expected-invalid-policy
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-project
          config-file: examples/invalid-scan-config/modrelease.toml
          tool-version: v0.3.15
          artifact-name: invalid-policy-report
      - name: Assert invalid scan policy was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-invalid-policy.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
